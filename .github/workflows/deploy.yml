name: Deploy FURSA Backend to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy via SSH (single backend instance)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to VPS (recreate fursa-backend)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BLOCKCHAIN_RPC_URL: ${{ secrets.BLOCKCHAIN_RPC_URL }}
          BLOCKCHAIN_CONTRACT_ADDRESS: ${{ secrets.BLOCKCHAIN_CONTRACT_ADDRESS }}
          BLOCKCHAIN_OWNER_PRIVATE_KEY: ${{ secrets.BLOCKCHAIN_OWNER_PRIVATE_KEY }}
          BLOCKCHAIN_CHAIN_ID: ${{ secrets.BLOCKCHAIN_CHAIN_ID }}
          BLOCKCHAIN_GAS_PRICE: ${{ secrets.BLOCKCHAIN_GAS_PRICE }}
          BLOCKCHAIN_GAS_LIMIT: ${{ secrets.BLOCKCHAIN_GAS_LIMIT }}
          # V2 G.6 (05/06/2026) : credentials SMTP Postal pour les emails
          # transactionnels. Si non definis, le service tombe en log-only.
          MAIL_HOST: ${{ secrets.MAIL_HOST }}
          MAIL_PORT: ${{ secrets.MAIL_PORT }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_FROM_NAME: ${{ secrets.MAIL_FROM_NAME }}
          MAIL_ENABLED: ${{ secrets.MAIL_ENABLED }}
        run: |
          # ServerAliveInterval=30s + Count=240 = keepalive jusqu'a 2h d'idle, evite "Broken pipe"
          # quand wait_healthy reste silencieux pendant Spring Boot startup (~5min)
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=240 \
              -i ~/.ssh/deploy_key ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "bash -s" <<EOF
            set -e
            cd ~/Fursa/FURSA-BACKEND

            echo "=== Syncing to origin/main ==="
            git fetch "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" main
            git reset --hard FETCH_HEAD
            git clean -fd

            echo "=== Syncing BLOCKCHAIN_* + MAIL_* secrets dans .env (sans toucher au reste) ==="
            grep -v -E '^(BLOCKCHAIN_|MAIL_)' .env > .env.tmp 2>/dev/null || cp .env .env.tmp
            echo "BLOCKCHAIN_RPC_URL=${BLOCKCHAIN_RPC_URL}" >> .env.tmp
            echo "BLOCKCHAIN_CONTRACT_ADDRESS=${BLOCKCHAIN_CONTRACT_ADDRESS}" >> .env.tmp
            echo "BLOCKCHAIN_OWNER_PRIVATE_KEY=${BLOCKCHAIN_OWNER_PRIVATE_KEY}" >> .env.tmp
            echo "BLOCKCHAIN_CHAIN_ID=${BLOCKCHAIN_CHAIN_ID}" >> .env.tmp
            echo "BLOCKCHAIN_GAS_PRICE=${BLOCKCHAIN_GAS_PRICE}" >> .env.tmp
            echo "BLOCKCHAIN_GAS_LIMIT=${BLOCKCHAIN_GAS_LIMIT}" >> .env.tmp
            # V2 G.6 (05/06/2026) : Postal SMTP pour les emails transactionnels.
            # Si MAIL_HOST est vide, le backend tombe en log-only sans crasher.
            [ -n "${MAIL_HOST}" ] && echo "MAIL_HOST=${MAIL_HOST}" >> .env.tmp
            [ -n "${MAIL_PORT}" ] && echo "MAIL_PORT=${MAIL_PORT}" >> .env.tmp
            [ -n "${MAIL_USERNAME}" ] && echo "MAIL_USERNAME=${MAIL_USERNAME}" >> .env.tmp
            [ -n "${MAIL_PASSWORD}" ] && echo "MAIL_PASSWORD=${MAIL_PASSWORD}" >> .env.tmp
            [ -n "${MAIL_FROM}" ] && echo "MAIL_FROM=${MAIL_FROM}" >> .env.tmp
            [ -n "${MAIL_FROM_NAME}" ] && echo "MAIL_FROM_NAME=${MAIL_FROM_NAME}" >> .env.tmp
            [ -n "${MAIL_ENABLED}" ] && echo "MAIL_ENABLED=${MAIL_ENABLED}" >> .env.tmp
            mv .env.tmp .env
            chmod 600 .env
            echo "Vars BLOCKCHAIN_* + MAIL_* injectees (\$(grep -c -E '^(BLOCKCHAIN_|MAIL_)' .env) lignes)"

            echo "=== Sauvegarde des uploads avant migration ==="
            # Securite : si fursa-backend-2 existait encore, on rapatrie ses fichiers
            # vers le volume partage AVANT de le supprimer.
            if docker ps -a --format '{{.Names}}' | grep -q '^fursa-backend-2\$'; then
              echo "Detection ancien fursa-backend-2, sauvegarde de /app/uploads"
              docker cp fursa-backend-2:/app/uploads/. /tmp/uploads-rescue/ 2>/dev/null || true
              if docker ps --format '{{.Names}}' | grep -q '^fursa-backend\$'; then
                docker cp /tmp/uploads-rescue/. fursa-backend:/app/uploads/ 2>/dev/null || true
              fi
            fi

            echo "=== Stop & remove old fursa-backend-2 (si present) ==="
            docker stop fursa-backend-2 2>/dev/null || true
            docker rm fursa-backend-2 2>/dev/null || true

            echo "=== Applying DB migrations (idempotent) ==="
            for sql_file in scripts/migrations/*.sql; do
              echo "--- Applying \$(basename \$sql_file) ---"
              docker cp "\$sql_file" fursa-db:/tmp/migration.sql
              docker exec fursa-db psql -U postgres -d fursa -f /tmp/migration.sql
            done
            echo "=== Migrations DB OK ==="

            echo "=== Building new backend image ==="
            docker compose build fursa-backend

            wait_healthy() {
              local container=\$1
              local max=\$2
              echo "Waiting for \$container to be healthy (max \${max}s)..."
              for i in \$(seq 1 \$((max / 5))); do
                status=\$(docker inspect --format '{{.State.Health.Status}}' "\$container" 2>/dev/null || echo "missing")
                if [ "\$status" = "healthy" ]; then
                  echo "\$container is healthy after \$((i * 5))s"
                  return 0
                fi
                if [ \$((i % 6)) -eq 0 ]; then
                  echo "  ... still waiting (\$((i * 5))s elapsed, status=\$status)"
                fi
                sleep 5
              done
              echo "ERROR: \$container did not become healthy within \${max}s"
              docker compose logs --tail=50 "\$container"
              return 1
            }

            echo "=== Recreate fursa-backend (single instance) ==="
            docker compose up -d --force-recreate --no-deps fursa-backend
            wait_healthy fursa-backend 600

            echo "=== Cleaning dangling images ==="
            docker image prune -f

            echo "=== Final status ==="
            docker ps --filter name=fursa --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
          EOF

      - name: Verify API is up via public URL
        run: |
          # Health check final côté public. Avec une seule instance, on tolere
          # une petite fenetre d'indispo pendant le recreate (Spring start ~5min).
          for i in $(seq 1 24); do
            code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 10 \
              https://api.fursa.seed-innov.com/api/health || echo "000")
            if [ "$code" = "200" ]; then
              echo "API public is up (HTTP 200 after ${i} attempt(s))"
              exit 0
            fi
            echo "Attempt $i/24: HTTP $code, retrying in 10s..."
            sleep 10
          done
          echo "Public API did not become healthy within 4 minutes"
          exit 1
