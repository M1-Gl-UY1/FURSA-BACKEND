server:
  port: 8081

spring:
  application:
    name: fursa-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      # Limites medias soumission : images jusqu'a 20 Mo, video de visite jusqu'a 200 Mo.
      # max-file-size doit couvrir le plus gros fichier (video 200 Mo).
      # max-request-size couvre la somme video + photos + documents.
      max-file-size: 200MB
      max-request-size: 400MB
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fursa}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:scorp}
    driver-class-name: org.postgresql.Driver

  # V2 G.6 (05/06/2026) : SMTP Postal pour les emails transactionnels.
  # Postal est deja installe sur le VPS (port 2525, plain SMTP avec AUTH PLAIN).
  # Les credentials passent via variables d'environnement (jamais en clair dans
  # le repo). Si MAIL_HOST est vide, le service tombera en log-only.
  #
  # Postal sur 2525 = plain SMTP sans STARTTLS. MAIL_STARTTLS_ENABLE permet
  # de basculer en STARTTLS pour un autre fournisseur (Gmail/Sendgrid/etc).
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:2525}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_STARTTLS_ENABLE:false}
            required: ${MAIL_STARTTLS_REQUIRED:false}
          # Timeout courts pour ne pas bloquer un thread de requete si Postal est down.
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

app:
  secret-key: ${JWT_SECRET:dev-only-secret-change-me-in-prod-min-32-chars-long-for-hs256}
  # Access token court : 1h par defaut. Le client recoit un refresh token a la connexion.
  expiration-time: ${JWT_EXPIRATION_MS:3600000}
  # Refresh token long : 7 jours par defaut. Stocke en DB, revocable, rotation a chaque /auth/refresh.
  refresh-expiration-time: ${REFRESH_EXPIRATION_MS:604800000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

  # V2 G.6 (05/06/2026) : config emails transactionnels.
  mail:
    # Adresse "from" affichee aux destinataires (compte expediteur sur Postal).
    from: ${MAIL_FROM:noreply@fursa.seed-innov.com}
    # Nom affiche a cote de l'adresse (ex : "FURSA").
    from-name: ${MAIL_FROM_NAME:FURSA}
    # URL publique du frontend (utilisee dans les liens des emails).
    front-base-url: ${MAIL_FRONT_BASE_URL:${app.front-base-url:https://fursa.seed-innov.com}}
    # Activation globale. Si false, les emails sont logges mais non envoyes
    # (utile pour les tests d'integration ou la phase de seed sans Postal).
    enabled: ${MAIL_ENABLED:true}

  # V2 T (07/06/2026) : config ancrage KYC on-chain.
  kyc-onchain:
    # Sel secret pour le hash KYC on-chain. JAMAIS commit en dur en prod.
    # Doit etre >= 32 chars. Si change apres mise en service, tous les hashes
    # historiques deviennent inverifiables — donc fige une fois pour toutes.
    salt: ${KYC_ONCHAIN_SALT:dev-only-salt-min-32-chars-change-in-prod-please}
    # Duree de validite d'un KYC en jours. Au-dela, le KYC passe en EXPIRE.
    duree-validite-jours: ${KYC_DUREE_VALIDITE_JOURS:365}

springdoc:
  swagger-ui:
    path: /swagger-ui
  api-docs:
    path: /v3/api-docs

logging:
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [requestId=%X{requestId:-}] %logger{36} - %msg%n'

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

# Blockchain (Web3j). Defauts = Hardhat local pour dev.
# En prod : tout passer via variables d'environnement, JAMAIS la cle privee en clair dans le repo.
# Chain ID : 1337 = Ganache, 31337 = Hardhat, 11155111 = Sepolia testnet, 137 = Polygon mainnet.
blockchain:
  rpc-url: ${BLOCKCHAIN_RPC_URL:http://127.0.0.1:8545}
  contract-address: ${BLOCKCHAIN_CONTRACT_ADDRESS:0x5b1869D9A4C187F2EAa108f3062412ecf0526b24}
  # Defaut = compte 0 Hardhat (cle publique connue, valable uniquement pour dev local).
  # En prod, surcharger via env var BLOCKCHAIN_OWNER_PRIVATE_KEY.
  owner-private-key: ${BLOCKCHAIN_OWNER_PRIVATE_KEY:0x4f3edf983ac636a65a842ce7c78d9aa706d3b113bce9c46f30d7d21715b23b1d}
  gas-price: ${BLOCKCHAIN_GAS_PRICE:2000000000}
  gas-limit: ${BLOCKCHAIN_GAS_LIMIT:30000000}
  chain-id: ${BLOCKCHAIN_CHAIN_ID:31337}
  # V2 P (07/06/2026) : RevenueLedger singleton (audit on-chain revenus + distributions).
  # Vide = LedgerService desactive (no-op silencieux). Renseigner apres deploiement Sepolia.
  revenue-ledger-address: ${BLOCKCHAIN_REVENUE_LEDGER_ADDRESS:}
  # V2 T (07/06/2026) : KycRegistry singleton (audit on-chain RGPD-safe).
  # Vide = KycLedgerService desactive (no-op silencieux).
  kyc-registry-address: ${BLOCKCHAIN_KYC_REGISTRY_ADDRESS:}
