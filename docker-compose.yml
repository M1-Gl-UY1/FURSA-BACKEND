services:
  fursa-db:
    image: postgres:16
    container_name: fursa-db
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-fursa}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?required}
    volumes:
      - fursa-db-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-fursa}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =========================================================================
  # Instance backend unique (8081). Le blue-green a 2 instances a ete retire
  # le 02/06/2026 : pour le volume utilisateurs actuel (<100 actifs), la
  # complexite (volume partage, debug split logs, RAM doublee) ne se
  # justifie pas. Un deploiement = quelques secondes d'indispo, acceptable.
  # Restaurer blue-green : ajouter un service fursa-backend-2 identique
  # (volume partage obligatoire) + maj upstream nginx.
  # =========================================================================

  fursa-backend:
    build: .
    image: fursa-backend:latest
    container_name: fursa-backend
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-dev}
      - DB_URL=jdbc:postgresql://fursa-db:5432/${POSTGRES_DB:-fursa}
      - DB_USERNAME=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD:?required}
      - JWT_SECRET=${JWT_SECRET:?required_min_32_chars}
      - JWT_EXPIRATION_MS=${JWT_EXPIRATION_MS:-86400000}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      - BLOCKCHAIN_RPC_URL=${BLOCKCHAIN_RPC_URL:?required}
      - BLOCKCHAIN_CONTRACT_ADDRESS=${BLOCKCHAIN_CONTRACT_ADDRESS:?required}
      - BLOCKCHAIN_OWNER_PRIVATE_KEY=${BLOCKCHAIN_OWNER_PRIVATE_KEY:?required}
      - BLOCKCHAIN_CHAIN_ID=${BLOCKCHAIN_CHAIN_ID:?required}
      - BLOCKCHAIN_GAS_PRICE=${BLOCKCHAIN_GAS_PRICE:-2000000000}
      - BLOCKCHAIN_GAS_LIMIT=${BLOCKCHAIN_GAS_LIMIT:-300000}
    # Volume persistant pour les fichiers uploades (photos, PDFs, videos).
    # CRITIQUE : sans ce volume, chaque --force-recreate au deploiement effacerait
    # tous les fichiers (anciennement /app/uploads etait dans la couche image,
    # ephemere et donc reset a chaque recreation du conteneur).
    volumes:
      - fursa-uploads:/app/uploads
    depends_on:
      fursa-db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8081/api/health 2>/dev/null | grep -q UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 360s  # Spring Boot 4 + JPA peut prendre 5-6 min a demarrer

volumes:
  fursa-db-data:
  fursa-uploads:
